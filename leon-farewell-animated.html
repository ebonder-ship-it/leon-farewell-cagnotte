<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bon voyage, Léon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ivory: #efe6d8;
    --card: #fbf5ea;
    --ink: #1e1410;
    --saffron: #b5601f;
    --gold: #e7a45b;
    --muted: #6b5d4d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ivory: #14100c;
      --card: #221b14;
      --ink: #f3ece0;
      --saffron: #e7a45b;
      --gold: #f0c184;
      --muted: #b3a48c;
    }
  }
  :root[data-theme="dark"] {
    --ivory: #14100c;
    --card: #221b14;
    --ink: #f3ece0;
    --saffron: #e7a45b;
    --gold: #f0c184;
    --muted: #b3a48c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--ivory);
    font-family: "Space Grotesk", sans-serif;
    color: var(--ink);
    overflow-x: hidden;
  }
  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 64px;
    position: relative;
    text-align: center;
  }
  .confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 14px;
    opacity: 0.9;
    border-radius: 2px;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(600deg); opacity: 0.3; }
  }
  .route {
    width: min(680px, 92vw);
    margin: 8px auto 28px;
    position: relative;
    height: 90px;
  }
  .route svg { width: 100%; height: 100%; display: block; }
  .route .dash {
    stroke: var(--saffron);
    stroke-width: 2.5;
    stroke-dasharray: 8 10;
    fill: none;
    opacity: 0.6;
  }
  .plane {
    position: absolute;
    top: 22px;
    left: 0;
    width: 46px;
    height: 46px;
    animation: fly 3.4s ease-in-out infinite;
  }
  @keyframes fly {
    0%   { left: 2%;  transform: translateY(0) rotate(0deg); }
    48%  { left: 92%; transform: translateY(-6px) rotate(4deg); }
    50%  { left: 92%; transform: translateY(-6px) rotate(4deg); }
    100% { left: 92%; transform: translateY(-6px) rotate(4deg); }
  }
  .city {
    position: absolute;
    top: 50px;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1.5px;
    color: var(--muted);
  }
  .city.from { left: 0; }
  .city.to { right: 0; }

  h1 {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 54px);
    margin: 0 0 6px;
    opacity: 0;
    animation: rise 0.7s ease forwards;
    animation-delay: 0.2s;
  }
  .sub {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-size: clamp(16px, 2.6vw, 20px);
    color: var(--muted);
    max-width: 560px;
    margin: 0 0 18px;
    opacity: 0;
    animation: rise 0.7s ease forwards;
    animation-delay: 0.9s;
  }
  .lines {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    opacity: 0;
    animation: rise 0.7s ease forwards;
    animation-delay: 1.6s;
  }
  .lines div {
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .lines b { color: var(--ink); }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .amount {
    margin-top: 30px;
    padding: 18px 34px;
    border-radius: 16px;
    background: var(--card);
    box-shadow: 0 10px 26px rgba(0,0,0,0.12);
    opacity: 0;
    animation: rise 0.7s ease forwards;
    animation-delay: 2.2s;
  }
  .amount .label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--saffron);
    font-weight: 700;
  }
  .amount .num {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1.1;
  }
  .amount .cur {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--muted);
  }
  button {
    margin-top: 34px;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 12px 26px;
    border-radius: 999px;
    border: 2px solid var(--saffron);
    background: transparent;
    color: var(--saffron);
    cursor: pointer;
    opacity: 0;
    animation: rise 0.7s ease forwards;
    animation-delay: 2.6s;
  }
  button:hover { background: var(--saffron); color: var(--card); }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="route">
    <svg viewBox="0 0 600 90" preserveAspectRatio="none">
      <path class="dash" d="M 20 45 Q 300 -10 580 45"></path>
    </svg>
    <div class="plane" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 16.5L22 12L2 7.5V10.8L14.5 12L2 13.2V16.5Z" fill="#b5601f"/>
      </svg>
    </div>
    <div class="city from">GENEVA</div>
    <div class="city to">INDIA</div>
  </div>

  <h1>Bon voyage, Léon</h1>
  <p class="sub">From baby bird at DLG Shanghai to Steve&nbsp;Jobs of the office &mdash; next stop, India.</p>

  <div class="lines">
    <div><b>5 years</b> of saying yes to everything</div>
    <div>Countless decks, <b>never early, just on time</b></div>
    <div>One <b>Swiss Army knife</b>, retired from the team drawer</div>
  </div>

  <div class="amount">
    <div class="label">TEAM CAGNOTTE</div>
    <div class="num">370</div>
    <div class="cur">CHF</div>
  </div>

  <button id="replay" type="button">Play it again</button>
</div>

<script>
  function burstConfetti() {
    var colors = ['#b5601f', '#e7a45b', '#1e1410', '#8a9a8a', '#c9bba4'];
    for (var i = 0; i < 70; i++) {
      (function () {
        var el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        var duration = 2.4 + Math.random() * 1.8;
        var delay = Math.random() * 1.2;
        el.style.animationDuration = duration + 's';
        el.style.animationDelay = delay + 's';
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, (duration + delay) * 1000 + 200);
      })();
    }
  }

  function playIntro() {
    burstConfetti();
    setTimeout(burstConfetti, 2200);
  }

  window.addEventListener('load', playIntro);

  document.getElementById('replay').addEventListener('click', function () {
    var stage = document.getElementById('stage');
    var clone = stage.cloneNode(true);
    stage.replaceWith(clone);
    document.getElementById('replay').addEventListener('click', arguments.callee);
    playIntro();
  });
</script>
</body>
</html>
